<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Mini-Site</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        header {
            margin-bottom: 30px;
        }
        .logo {
            width: 80px;
            height: auto;
        }
        .main-image {
            max-width: 400px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
        }
        .download-btn {
            background-color: #2ea44f;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            display: inline-block;
            margin: 20px 0;
        }
        .download-btn:hover {
            background-color: #2c974b;
        }
        .content-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        .side-image {
            width: 150px;
            height: auto;
            border-radius: 6px;
        }
        .side-text {
            max-width: 300px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- En-tête avec le logo -->
    <header>
        <img src="logo.png" alt="Logo" class="logo">
    </header>

    <!-- Image centrale -->
    <section>
        <img src="image-centrale.jpg" alt="Image centrale" class="main-image">
    </section>

    <!-- Bouton de téléchargement -->
    <section>
        <a href="ton-fichier.zip" class="download-btn" download>Télécharger</a>
    </section>

    <!-- Section avec image à gauche, texte au milieu, image à droite -->
    <section class="content-section">
        <img src="image-gauche.jpg" alt="Image gauche" class="side-image">
        <p class="side-text">Ceci est ton texte explicatif placé au milieu, avec une image de chaque côté pour habiller ta page selon tes envies.</p>
        <img src="image-droite.jpg" alt="Image droite" class="side-image">
    </section>

</body>
</html>
